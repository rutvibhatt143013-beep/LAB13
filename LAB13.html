<h1> STUDENT REG FORM</h1>
<form id="studentForm" onsubmit="return validateMyform()">

    Enrollment Number: <br>
    <input type="text" id="enrollment"><br><br>

    Name: <br>
    <input type="text" id="name"><br><br>

    Email ID: <br>
    <input type="email" id="email"><br><br>

    Password: <br>
    <input type="password" id="password"><br><br>

    Confirm Password: <br>
    <input type="password" id="confirmPassword"><br><br>

    Phone Number: <br>
    <input type="text" id="phone"><br><br>

    Address: <br>
    <textarea id="address" rows="3" cols="30"></textarea><br><br>

    Gender: <br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    Branch: <br>
    <select id="branch">
        <option value="">--Select Branch--</option>
        <option value="Computer Engineering">Computer Engineering</option>
        <option value="IT Engineering">IT Engineering</option>
        <option value="Electronics">Electronics</option>
        <option value="Mechanical">Mechanical</option>
        <option value="Civil">Civil</option>
    </select><br><br>

    <input type="submit" value="Submit">
</form>
<script>
    function validateMyform() {
        var enrollment = document.getElementById("enrollment").value;
        var name = document.getElementById("name").value;
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;
        var phone = document.getElementById("phone").value;
        var address = document.getElementById("address").value;
        var branch = document.getElementById("branch").value;
        var gender = document.querySelector('input[name="gender"]:checked');

        if (enrollment == "") {
            alert("Please enter enrollment number");
            return false;
        }

        if (name == "") {
            alert("Please enter name");
            return false;
        }

        if (!/^[A-Za-z ]+$/.test(name)) {
            alert("Name should contain only letters");
            return false;
        }

        if (email == "") {
            alert("Please enter email");
            return false;
        }

        if (password.length < 6) {
            alert("Password must contain at least 6 characters");
            return false;
        }

        if (password != confirmPassword) {
            alert("Password and confirm password do not match");
            return false;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
            alert("Phone number must contain exactly 10 digits");
            return false;
        }

        if (address.trim() == "") {
            alert("Please enter address");
            return false;
        }

        if (gender == null) {
            alert("Please select gender");
            return false;
        }

        if (branch == "") {
            alert("Please select branch");
            return false;
        }

        alert("Student Registration Successful!");
        return true;
    }
</script>
